# NATS Server Configuration for Us (local dev)

port: 4222
http_port: 8222

# JetStream for persistence
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Logging
debug: true
trace: false
logtime: true
log_file: "/data/nats.log"

# Limits
max_payload: 8MB
max_connections: 1000