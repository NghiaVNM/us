[workspace]
resolver  = "2"
members   = [
  "crates/us-crypto",
  # "crates/*",
  # "services/*",
  # "apps/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Mike"]

[workspace.dependencies]
# Async runtime
tokio     = { version = "1.41", features = ["full"] }

# Crypto
chacha20poly1305  = "0.10"
crypto_box        = "0.9"
ed25519-dalek     = { version = "2.1", features = ["rand_core"] }
argon2            = "0.5"
hkdf              = "0.12"
sha2              = "0.10"
getrandom         = { version = "0.2", features = ["js"] }
zeroize           = { version = "1.8", features = ["derive"] }

# Protobuf
prost       = "0.13"
prost-types = "0.13"
tonic       = "0.12"

# DB
sqlx  = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "migrate", "json", "uuid", "time"] }

# HTTP
axum        = { version = "0.7", features = ["macros"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["trace", "cors"] }
hyper       = "1.5"

# Serialization
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

# Time
time  = "0.3"

# UUID
uuid  = { version = "1.11", features = ["v7", "serde"] }

# Error handling
anyhow    = "1.0"
thiserror = "2.0"

# Tracing
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter", "json"] }

# Config
config  = "0.14"

# NATS
async-nats  = "0.37"

# Misc
bytes = "1.9"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
