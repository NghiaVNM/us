[advisories]
version = 2
ignore  = []

[licenses]
version = 2
allow   = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
]

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[sources]
unknown-registry  = "deny"
unknown-git       = "deny"